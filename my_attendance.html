<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">ElvaRiq</div>
        <a class="active" href="/my-attendance">My Attendance</a>
        <a href="/logout">Logout</a>
    </aside>

    <main class="content">
        <div class="page-header">
            <h1>My Attendance</h1>
            <p>{{ employee_name }} | Date: {{ today }}</p>
        </div>

        <form method="POST">
            <label>
                <input type="radio" name="status" value="Present" {% if saved_status == "Present" %}checked{% endif %} required>
                Present
            </label>

            <label>
                <input type="radio" name="status" value="Absent" {% if saved_status == "Absent" %}checked{% endif %} required>
                Absent
            </label>

            <button type="submit">Save My Attendance</button>
        </form>

        {% if saved_status %}
            <div class="panel">
                <h2>Saved Status</h2>
                <p>{{ employee_name }} - {{ saved_status }}</p>
            </div>
        {% endif %}
    </main>
</body>
</html>
