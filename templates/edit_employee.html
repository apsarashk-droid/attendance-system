<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        a {
            color: #2563eb;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 230px;
            height: 100vh;
            background: #111827;
            color: #fff;
            padding: 24px 18px;
            box-sizing: border-box;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 28px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sidebar a.active,
        .sidebar a:hover {
            background: #2563eb;
            color: #fff;
        }

        .content {
            margin-left: 230px;
            padding: 40px;
        }

        form {
            max-width: 520px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 16px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 12px;
        }

        input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 4px;
            padding: 10px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
        }

        @media (max-width: 760px) {
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
            }

            .content {
                margin-left: 0;
                padding: 24px;
            }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">ElvaRiq</div>
        <a href="/">Dashboard</a>
        <a href="/attendance">Mark Attendance</a>
        <a class="active" href="/employees">Employee Details</a>
        <a href="/records">Attendance Records</a>
        <a href="/logout">Logout</a>
    </aside>

    <main class="content">
        <div class="page-header">
            <h1>Edit Employee</h1>
            <p><a href="/employees">Back to employee details</a></p>
        </div>

        <form method="POST">
            <label>
                Employee Name
                <input type="text" name="name" value="{{ employee[1] }}" required>
            </label>

            <label>
                Phone
                <input type="text" name="phone" value="{{ employee[2] or '' }}">
            </label>

            <label>
                Email
                <input type="email" name="email" value="{{ employee[3] or '' }}">
            </label>

            <label>
                Department
                <input type="text" name="department" value="{{ employee[4] or '' }}">
            </label>

            <label>
                Login Username
                <input type="text" name="username" value="{{ employee[5] or '' }}">
            </label>

            <label>
                Login Password
                <input type="password" name="password" value="{{ employee[6] or '' }}">
            </label>

            <button type="submit">Update Employee</button>
        </form>
    </main>
</body>
</html>
